<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <title>3.3万円相当の個別分析レポートを無料で</title>

  <!-- Google Fonts: Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Inlined Strict Mobile-Lock Styles to guarantee instantaneous application -->
  <style>
    *, *::before, *::after {
      box-sizing: border-box !important;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 100% !important;
      overflow-x: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
      position: relative !important;
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      background-color: #EEF2FF !important;
      color: #0F172A !important;
      line-height: 1.5 !important;
      touch-action: pan-y !important;
      -webkit-text-size-adjust: 100% !important;
    }

    /* Top Blue Area with pure internal gradient (no overflowing elements) */
    .header-blue-gradient {
      background: radial-gradient(circle at 90% 10%, rgba(255, 255, 255, 0.18) 0%, transparent 40%),
                  radial-gradient(circle at 10% 90%, rgba(79, 70, 229, 0.4) 0%, transparent 50%),
                  linear-gradient(155deg, #4F46E5 0%, #4338CA 45%, #3B82F6 100%) !important;
      position: relative !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }

    /* Fixed 16px to prevent iOS Safari auto-zooming on input focus */
    .app-input,
    input[type="text"],
    input[type="email"],
    input[type="url"],
    textarea {
      width: 100% !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
      padding: 12px 14px !important;
      background-color: #F8FAFC !important;
      border: 1.5px solid #E2E8F0 !important;
      border-radius: 14px !important;
      color: #0F172A !important;
      font-size: 16px !important; /* STRICT 16px FOR IOS */
      font-family: inherit !important;
      font-weight: 500 !important;
      outline: none !important;
      -webkit-appearance: none !important;
      appearance: none !important;
      touch-action: manipulation !important;
    }

    .app-input:focus,
    input:focus,
    textarea:focus {
      background-color: #FFFFFF !important;
      border-color: #4F46E5 !important;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15) !important;
    }

    .app-input::placeholder,
    input::placeholder,
    textarea::placeholder {
      color: #94A3B8 !important;
      font-size: 14px !important;
    }

    /* Radio Card Styles */
    .radio-card {
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      padding: 11px 14px !important;
      background-color: #F8FAFC !important;
      border: 1.5px solid #E2E8F0 !important;
      border-radius: 14px !important;
      transition: all 0.2s ease !important;
      user-select: none !important;
      touch-action: manipulation !important;
      cursor: pointer !important;
    }

    .radio-card.active {
      background-color: #EEF2FF !important;
      border-color: #4F46E5 !important;
    }

    .radio-ring {
      width: 18px !important;
      height: 18px !important;
      border-radius: 50% !important;
      border: 2px solid #CBD5E1 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      flex-shrink: 0 !important;
    }

    .radio-card.active .radio-ring {
      border-color: #4F46E5 !important;
    }

    .radio-card.active .radio-ring::after {
      content: '' !important;
      width: 8px !important;
      height: 8px !important;
      border-radius: 50% !important;
      background-color: #4F46E5 !important;
    }

    /* Submit Button */
    .app-btn-submit {
      background: linear-gradient(135deg, #4F46E5 0%, #3B82F6 100%) !important;
      cursor: pointer !important;
      touch-action: manipulation !important;
    }

    .app-btn-submit:active {
      transform: scale(0.98) !important;
    }

    /* URL Collapsible */
    .url-animated-container {
      transition: max-height 0.25s ease, opacity 0.2s ease, margin 0.25s ease !important;
      max-height: 140px !important;
      opacity: 1 !important;
      overflow: hidden !important;
    }

    .url-animated-container.hidden-section {
      max-height: 0 !important;
      opacity: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }
  </style>
</head>
<body class="min-h-screen flex justify-center items-start sm:py-8 sm:px-4 antialiased">

  <!-- Main Responsive Container -->
  <div class="w-full max-w-full sm:max-w-[450px] bg-white sm:rounded-[32px] shadow-xl overflow-hidden min-h-screen sm:min-h-0 sm:border sm:border-indigo-100 flex flex-col">
    
    <!-- 头部蓝色区域 (タイトル & 説明) -->
    <div class="header-blue-gradient px-5 pt-8 pb-10 sm:px-7 sm:pt-10 sm:pb-12 text-white">
      
      <div class="w-full">
        <!-- 徽章 -->
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/20 backdrop-blur-md border border-white/30 text-white text-[11px] font-extrabold mb-3">
          <span class="w-2 h-2 rounded-full bg-amber-300 animate-pulse"></span>
          <span>無料プレゼント</span>
        </div>

        <!-- 見出し (自适应不会超出屏幕) -->
        <h1 class="text-[21px] sm:text-[25px] font-black tracking-tight text-white leading-tight mb-2.5">
          3.3万円相当の<br>個別分析レポートを無料で
        </h1>

        <!-- 説明 -->
        <p class="text-white/95 text-[13px] sm:text-[14px] leading-relaxed font-medium">
          1分ほどの入力でお申し込みいただけます。<br>
          内容を確認し、あなたの会社に合わせて個別に分析します。
        </p>
      </div>
    </div>

    <!-- 白色区域 (表单 Form Sheet) -->
    <div class="relative -mt-5 bg-white rounded-t-[28px] px-5 pt-6 pb-10 sm:px-7 sm:pb-10 flex-grow shadow-[0_-8px_20px_rgba(0,0,0,0.03)] z-10">
      
      <form id="lead-form" class="space-y-4" novalidate>
        
        <!-- メールアドレス (必須) -->
        <div>
          <div class="flex items-center justify-between text-xs sm:text-sm font-bold text-slate-800 mb-1.5">
            <span>メールアドレス</span>
            <span class="text-[10px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full border border-rose-100">必須</span>
          </div>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            placeholder="example@company.co.jp"
            class="app-input"
            autocomplete="email"
          >
          <p id="email-error" class="hidden text-xs text-rose-600 font-semibold mt-1">
            ※ 有効なメールアドレスを入力してください
          </p>
        </div>

        <!-- ホームページはありますか？ (必須) -->
        <div>
          <div class="flex items-center justify-between text-xs sm:text-sm font-bold text-slate-800 mb-1.5">
            <span>ホームページはありますか？</span>
            <span class="text-[10px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full border border-rose-100">必須</span>
          </div>
          
          <div class="grid grid-cols-2 gap-3 mt-1">
            <label class="radio-card active" id="label-has-website-yes">
              <input type="radio" name="has_website_radio" value="ある" checked class="hidden">
              <span class="radio-ring"></span>
              <span class="text-sm font-bold text-slate-800">ある</span>
            </label>

            <label class="radio-card" id="label-has-website-no">
              <input type="radio" name="has_website_radio" value="ない" class="hidden">
              <span class="radio-ring"></span>
              <span class="text-sm font-bold text-slate-800">ない</span>
            </label>
          </div>
          <input type="hidden" id="has-website" name="has_website" value="ある">
        </div>

        <!-- ホームページURL (※「ある」を選んだ方のみ) -->
        <div id="website-url-wrapper" class="url-animated-container">
          <div class="text-xs sm:text-sm font-bold text-slate-800 mb-1.5">
            <span>ホームページURL</span>
            <span class="text-[11px] text-slate-400 font-normal ml-1">※「ある」を選んだ方のみ</span>
          </div>
          <input 
            type="url" 
            id="website-url" 
            name="website_url" 
            placeholder="https://example.co.jp"
            class="app-input"
          >
        </div>

        <!-- 会社名 (任意) -->
        <div>
          <div class="flex items-center justify-between text-xs sm:text-sm font-bold text-slate-800 mb-1.5">
            <span>会社名</span>
            <span class="text-[10px] font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">任意</span>
          </div>
          <input 
            type="text" 
            id="company-name" 
            name="company_name" 
            placeholder="例：株式会社サンプル"
            class="app-input"
            autocomplete="organization"
          >
        </div>

        <!-- 特に気になること・相談したいこと (任意) -->
        <div>
          <div class="flex items-center justify-between text-xs sm:text-sm font-bold text-slate-800 mb-1.5">
            <span>特に気になること・相談したいこと</span>
            <span class="text-[10px] font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">任意</span>
          </div>
          <textarea 
            id="inquiry-content" 
            name="inquiry_content" 
            rows="3" 
            placeholder="集客を増やしたい、リニューアルを考えている等、ご自由にご記入ください。"
            class="app-input resize-y min-h-[85px]"
          ></textarea>
        </div>

        <!-- ボタン -->
        <div class="pt-2">
          <button 
            type="submit" 
            id="submit-btn"
            class="app-btn-submit w-full py-3.5 px-5 rounded-2xl text-base font-bold text-white tracking-wide shadow-lg shadow-indigo-500/25 transition-all"
          >
            無料で分析レポートを申し込む
          </button>
        </div>

        <!-- 補足 -->
        <div class="text-center pt-1">
          <p class="text-xs text-slate-500 flex items-center justify-center gap-1 font-medium">
            <svg class="w-3.5 h-3.5 text-emerald-500 inline shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
            無理な営業はいたしません。
          </p>
        </div>

      </form>
    </div>

  </div>

  <!-- Success Modal -->
  <div id="success-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300">
    <div class="bg-white rounded-[24px] max-w-xs w-full p-6 text-center shadow-2xl transform scale-95 transition-all duration-300">
      <div class="w-14 h-14 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto mb-3 border border-indigo-100">
        <svg class="w-7 h-7 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      <h3 class="text-base font-bold text-slate-900 mb-1.5">
        送信が完了しました
      </h3>
      <p class="text-xs text-slate-600 leading-relaxed mb-5">
        お申し込みいただきありがとうございます。<br>
        内容を確認の上、担当者よりご連絡いたします。
      </p>
      <button 
        type="button" 
        onclick="closeSuccessModal()"
        class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs transition-all"
      >
        閉じる
      </button>
    </div>
  </div>

  <!-- JavaScript for anti-zoom and form processing -->
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    // Disable iOS double-tap zoom & pinch-to-zoom completely
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, false);
  </script>
</body>
</html>
