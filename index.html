<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3.3万円相当の個別分析レポートを無料で</title>

  <!-- Google Fonts: Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#EEF2FF] text-[#0F172A] min-h-screen flex justify-center items-start sm:py-8 sm:px-4 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- App Wrapper Container (Strictly 100% on mobile, max 480px on desktop) -->
  <div class="w-full max-w-full sm:max-w-[460px] bg-white sm:rounded-[36px] shadow-[0_25px_60px_-15px_rgba(79,70,229,0.18)] overflow-hidden min-h-screen sm:min-h-0 sm:border sm:border-indigo-100/60 flex flex-col">
    
    <!-- 头部蓝色区域 (タイトル & 説明) -->
    <div class="header-blue-gradient relative px-5 pt-8 pb-10 sm:px-8 sm:pt-10 sm:pb-12 text-white overflow-hidden">
      
      <!-- Top Badge / Header Accent -->
      <div class="relative z-10">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/20 backdrop-blur-md border border-white/30 text-white text-[11px] sm:text-xs font-extrabold mb-3 shadow-sm">
          <span class="w-2 h-2 rounded-full bg-amber-300 animate-pulse"></span>
          <span>無料プレゼント</span>
        </div>

        <!-- 見出し (Responsive fluid size that NEVER exceeds mobile screen) -->
        <h1 class="hero-title font-black tracking-tight text-white drop-shadow-sm mb-2.5">
          3.3万円相当の<br>個別分析レポートを無料で
        </h1>

        <!-- 説明 -->
        <p class="hero-desc text-white/95 leading-relaxed font-medium">
          1分ほどの入力でお申し込みいただけます。<br>
          内容を確認し、あなたの会社に合わせて個別に分析します。
        </p>
      </div>
    </div>

    <!-- 白色区域 (表单 Form Sheet) -->
    <div class="relative -mt-5 bg-white rounded-t-[28px] px-5 pt-7 pb-10 sm:px-8 sm:pb-12 flex-grow shadow-[0_-10px_30px_rgba(0,0,0,0.04)] z-20">
      
      <form id="lead-form" class="space-y-4" novalidate>
        
        <!-- メールアドレス (必須) -->
        <div>
          <label for="email" class="flex items-center justify-between text-xs sm:text-sm font-bold text-slate-800 mb-1.5">
            <span>メールアドレス</span>
            <span class="text-[11px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full border border-rose-100">必須</span>
          </label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            placeholder="example@company.co.jp"
            class="app-input"
            autocomplete="email"
          >
          <p id="email-error" class="hidden text-xs text-rose-600 font-semibold mt-1 flex items-center gap-1">
            <span>※ 有効なメールアドレスを入力してください</span>
          </p>
        </div>

        <!-- ホームページはありますか？ (必須) -->
        <div>
          <label class="flex items-center justify-between text-xs sm:text-sm font-bold text-slate-800 mb-1.5">
            <span>ホームページはありますか？</span>
            <span class="text-[11px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full border border-rose-100">必须</span>
          </label>
          
          <div class="grid grid-cols-2 gap-3 mt-1">
            <label class="radio-card active cursor-pointer" id="label-has-website-yes">
              <input type="radio" name="has_website_radio" value="ある" checked class="hidden">
              <span class="radio-ring"></span>
              <span class="text-sm font-bold text-slate-800">ある</span>
            </label>

            <label class="radio-card cursor-pointer" id="label-has-website-no">
              <input type="radio" name="has_website_radio" value="ない" class="hidden">
              <span class="radio-ring"></span>
              <span class="text-sm font-bold text-slate-800">ない</span>
            </label>
          </div>
          <input type="hidden" id="has-website" name="has_website" value="ある">
        </div>

        <!-- ホームページURL (※「ある」を選んだ方のみ) -->
        <div id="website-url-wrapper" class="url-animated-container">
          <label for="website-url" class="block text-xs sm:text-sm font-bold text-slate-800 mb-1.5">
            <span>ホームページURL</span>
            <span class="text-xs text-slate-400 font-normal ml-1">※「ある」を選んだ方のみ</span>
          </label>
          <input 
            type="url" 
            id="website-url" 
            name="website_url" 
            placeholder="https://example.co.jp"
            class="app-input"
          >
        </div>

        <!-- 会社名 (任意) -->
        <div>
          <label for="company-name" class="flex items-center justify-between text-xs sm:text-sm font-bold text-slate-800 mb-1.5">
            <span>会社名</span>
            <span class="text-[11px] font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">任意</span>
          </label>
          <input 
            type="text" 
            id="company-name" 
            name="company_name" 
            placeholder="例：株式会社サンプル"
            class="app-input"
            autocomplete="organization"
          >
        </div>

        <!-- 特に気になること・相談したいこと (任意) -->
        <div>
          <label for="inquiry-content" class="flex items-center justify-between text-xs sm:text-sm font-bold text-slate-800 mb-1.5">
            <span>特に気になること・相談したいこと</span>
            <span class="text-[11px] font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">任意</span>
          </label>
          <textarea 
            id="inquiry-content" 
            name="inquiry_content" 
            rows="3" 
            placeholder="集客を増やしたい、リニューアルを考えている等、ご自由にご記入ください。"
            class="app-input resize-y min-h-[85px]"
          ></textarea>
        </div>

        <!-- ボタン -->
        <div class="pt-2">
          <button 
            type="submit" 
            id="submit-btn"
            class="app-btn-submit w-full py-3.5 px-5 rounded-2xl text-base font-bold text-white tracking-wide shadow-lg shadow-indigo-500/25 active:scale-[0.99] transition-all"
          >
            無料で分析レポートを申し込む
          </button>
        </div>

        <!-- 補足 -->
        <div class="text-center pt-1">
          <p class="text-xs text-slate-500 flex items-center justify-center gap-1 font-medium">
            <svg class="w-3.5 h-3.5 text-emerald-500 inline shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
            無理な営業はいたしません。
          </p>
        </div>

      </form>
    </div>

  </div>

  <!-- Success Modal -->
  <div id="success-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300">
    <div class="bg-white rounded-[24px] max-w-xs w-full p-6 text-center shadow-2xl transform scale-95 transition-all duration-300">
      <div class="w-14 h-14 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto mb-3 border border-indigo-100">
        <svg class="w-7 h-7 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      <h3 class="text-base font-bold text-slate-900 mb-1.5">
        送信が完了しました
      </h3>
      <p class="text-xs text-slate-600 leading-relaxed mb-5">
        お申し込みいただきありがとうございます。<br>
        内容を確認の上、担当者よりご連絡いたします。
      </p>
      <button 
        type="button" 
        onclick="closeSuccessModal()"
        class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs transition-all"
      >
        閉じる
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
